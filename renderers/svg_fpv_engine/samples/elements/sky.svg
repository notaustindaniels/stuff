<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0820"/>
      <stop offset="35%" stop-color="#241236"/>
      <stop offset="58%" stop-color="#5a2538"/>
      <stop offset="70%" stop-color="#b85230"/>
      <stop offset="80%" stop-color="#e8902c"/>
      <stop offset="92%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d0"/>
      <stop offset="22%" stop-color="#ffd070"/>
      <stop offset="45%" stop-color="#e87838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#601810" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#sky)"/>
  <!-- stars in the upper portion -->
  <g fill="#fff8d8">
    <circle cx="90"   cy="40"  r="1.0" opacity="0.7"/>
    <circle cx="220"  cy="100" r="1.4" opacity="0.85"/>
    <circle cx="380"  cy="60"  r="0.9" opacity="0.6"/>
    <circle cx="510"  cy="140" r="1.2" opacity="0.7"/>
    <circle cx="640"  cy="50"  r="0.8" opacity="0.5"/>
    <circle cx="780"  cy="120" r="1.3" opacity="0.8"/>
    <circle cx="930"  cy="70"  r="1.0" opacity="0.7"/>
    <circle cx="1090" cy="150" r="1.5" opacity="0.9"/>
    <circle cx="1230" cy="60"  r="0.9" opacity="0.6"/>
    <circle cx="1380" cy="120" r="1.1" opacity="0.7"/>
    <circle cx="1500" cy="50"  r="1.3" opacity="0.85"/>
    <circle cx="160"  cy="180" r="0.7" opacity="0.5"/>
    <circle cx="320"  cy="210" r="0.9" opacity="0.6"/>
    <circle cx="700"  cy="220" r="0.8" opacity="0.5"/>
    <circle cx="1140" cy="200" r="0.9" opacity="0.6"/>
    <circle cx="1450" cy="200" r="0.8" opacity="0.55"/>
  </g>
  <!-- sun -->
  <circle cx="940" cy="430" r="120" fill="url(#sun)"/>
  <circle cx="940" cy="430" r="38" fill="#fffce4"/>
  <!-- thin horizon band -->
  <rect y="440" width="1600" height="6" fill="#ffac68" opacity="0.45"/>
</svg>
